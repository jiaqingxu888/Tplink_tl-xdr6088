name: 'TEST: Force Build Firmware'

on:
  workflow_dispatch: # 测试版仅保留手动触发，避免意外消耗额度

permissions:
  contents: write

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  UPSTREAM_BRANCH: openwrt-24.10-6.6
  DEFCFG_FILE: defconfig/mt7986-ax6000_dae.config
  CFG_TARGET: mediatek
  CFG_SUBTARGET: filogic
  DEVICE_NAME: tplink_tl-xdr6088
  DEFAULT_IP: '192.168.1.1'
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set timezone and build date
        run: |
          sudo timedatectl set-timezone "$TZ"
          echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Free disk space (Maximize build space)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell /usr/share/swift /usr/share/miniconda
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Probe upstream and FORCE build for testing
        id: decide
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          UP_SHA=$(git ls-remote "$UPSTREAM_REPO" "refs/heads/${UPSTREAM_BRANCH}" | awk '{print $1}')
          if [ -z "$UP_SHA" ]; then
            echo "::error::FATAL: Cannot resolve upstream HEAD"
            exit 1
          fi
          FP=$( ( echo "$UP_SHA"; cat "$DEFCFG_FILE"; echo "$CFG_TARGET|$CFG_SUBTARGET|$DEVICE_NAME|$DEFAULT_IP|$UPSTREAM_BRANCH" ) | sha256sum | cut -c1-12 )
          
          echo "================ DECIDE (TEST MODE) ================"
          echo "upstream HEAD  = $UP_SHA"
          echo "current FP     = $FP"
          echo "SHOULD_BUILD   = true (Forced for testing)"
          echo "===================================================="
          
          # 测试版：强制设置为 true
          echo "SHOULD_BUILD=true" >> "$GITHUB_ENV"
          echo "FP=$FP" >> "$GITHUB_ENV"
          echo "UP_SHA=$UP_SHA" >> "$GITHUB_ENV"

      - name: Clone upstream source
        if: env.SHOULD_BUILD == 'true'
        run: |
          git clone --depth 1 -b "$UPSTREAM_BRANCH" "$UPSTREAM_REPO" openwrt
          cd openwrt
          echo "cloned HEAD = $(git rev-parse HEAD) expect $UP_SHA"

      - name: Cache OpenWrt downloads (dl)
        if: env.SHOULD_BUILD == 'true'
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ env.CFG_TARGET }}-${{ env.CFG_SUBTARGET }}-${{ hashFiles('defconfig/**') }}
          restore-keys: |
            openwrt-dl-${{ env.CFG_TARGET }}-${{ env.CFG_SUBTARGET }}-

      - name: Install build dependencies
        if: env.SHOULD_BUILD == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget ca-certificates python3 python3-pip libelf-dev ecj fastjar

      - name: Update and install feeds
        if: env.SHOULD_BUILD == 'true'
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply defconfig and lock single device
        if: env.SHOULD_BUILD == 'true'
        working-directory: openwrt
        run: |
          set -euo pipefail
          if [ ! -f "../$DEFCFG_FILE" ]; then
            echo "::error::FATAL: defconfig not found: $DEFCFG_FILE"; exit 1
          fi
          cp "../$DEFCFG_FILE" .config
          make defconfig
          
          echo "---- device switches that are =y ----"
          grep -E 'CONFIG_TARGET_.*_DEVICE_.*=y' .config || echo "(none)"
          
          if ! grep -qE 'CONFIG_TARGET_.*_DEVICE_tplink_tl-xdr6088=y' .config; then
            echo "::error::FATAL: xdr6088 NOT selected after make defconfig. Check your defconfig prefix."
            exit 1
          fi
          echo "✅ xdr6088 is successfully selected."

      - name: Download sources
        if: env.SHOULD_BUILD == 'true'
        working-directory: openwrt
        run: |
          make download -j8 V=s || make download -j1 V=s

      - name: Build firmware
        if: env.SHOULD_BUILD == 'true'
        working-directory: openwrt
        run: |
          # 限制并发数防止 GitHub Runner (7GB RAM) 内存溢出 (OOM)
          CORES=$(nproc)
          JOBS=$(( CORES > 2 ? 3 : CORES ))
          echo "Building with -j$JOBS to prevent OOM..."
          make -j$JOBS V=s

      - name: Collect firmware and generate checksums
        if: env.SHOULD_BUILD == 'true'
        working-directory: openwrt
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release"
          find bin/targets -type f \( -name '*xdr6088*-sysupgrade.bin' -o -name '*xdr6088*-factory.bin' \) -exec cp -v {} "$GITHUB_WORKSPACE/release/" \;
          
          echo "==== collected files ===="
          ls -lh "$GITHUB_WORKSPACE/release/"
          
          N=$(find "$GITHUB_WORKSPACE/release/" -type f \( -name '*-sysupgrade.bin' -o -name '*-factory.bin' \) | wc -l)
          if [ "$N" -lt 1 ]; then 
            echo "::error::FATAL: no xdr6088 firmware produced"; exit 1
          fi
          
          cd "$GITHUB_WORKSPACE/release"
          sha256sum *.bin > sha256sums.txt
          cat sha256sums.txt

      - name: Build rich release notes
        if: env.SHOULD_BUILD == 'true'
        working-directory: openwrt
        env:
          GITHUB_RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        run: |
          set -euo pipefail
          BIN=$(find "$GITHUB_WORKSPACE/release/" -name '*-sysupgrade.bin' | head -1)
          MANIFEST=$(find bin/targets -name '*.manifest' | head -1)
          PJSON=$(find bin/targets -name 'profiles.json' | head -1)
          
          SIZE=$(ls -lh "$BIN" | awk '{print $5}')
          VER=$(grep -oE '"version_number": *"[^"]*"' "$PJSON" | head -1 | cut -d'"' -f4 || echo "unknown")
          VCODE=$(grep -oE '"version_code": *"[^"]*"' "$PJSON" | head -1 | cut -d'"' -f4 || echo "unknown")
          SHA256_SUMS=$(cat "$GITHUB_WORKSPACE/release/sha256sums.txt")
          
          PKGS_LIST=$(awk -F' - ' '{print $1}' "$MANIFEST" | sort | sed 's/^/- /')
          
          OUT=/tmp/notes.md
          cat <<EOF > "$OUT"
          ## 📦 固件信息 (Firmware Info)

          | 属性 | 值 |
          | :--- | :--- |
          | **设备型号** | $DEVICE_NAME |
          | **固件版本** | ${VER} (${VCODE}) |
          | **上游 Commit** | [${UP_SHA:0:10}]($UPSTREAM_REPO/commit/$UP_SHA) |
          | **编译指纹** | \`$FP\` |
          | **固件大小** | $SIZE |
          | **默认 IP** | \`$DEFAULT_IP\` |
          | **编译时间** | $BUILD_DATE (Asia/Shanghai) |
          | **特性** | 内核 BPF/XDP 已启用 (dae 就绪) |

          ## 📝 更新说明 (Update Guide)

          1. **Web 升级 (LuCI)**: 系统 -> 备份/升级 -> 上传 \`sysupgrade.bin\`，按需勾选“保留配置”。
          2. **命令行升级**: \`sysupgrade -n /tmp/固件名.bin\`（\`-n\` 表示不保留配置，首次刷入或跨大版本升级强烈建议添加）。
          3. ⚠️ **注意**: 升级前请务必备份重要配置；跨大版本升级建议**不保留配置**以防兼容性问题。

          ## 📊 校验和 (SHA256 Checksums)

          \`\`\`text
          $SHA256_SUMS
          \`\`\`

          <details>
          <summary>📦 内置软件包列表 (Installed Packages)</summary>

          $PKGS_LIST
          </details>

          ---
          > 🤖 本固件由 GitHub Actions 自动编译生成 | [查看构建日志]($GITHUB_RUN_URL)
          EOF
          
          echo "---- notes preview ----"
          cat "$OUT"

      - name: Create GitHub Release
        if: env.SHOULD_BUILD == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # 测试版加了 -TEST 后缀，防止覆盖正式 Release
          tag_name: 'TEST-build-${{ env.FP }}-${{ env.DEVICE_NAME }}'
          name: '[TEST] ${{ env.DEVICE_NAME }} @ ${{ env.BUILD_DATE }}'
          body_path: /tmp/notes.md
          files: |
            release/*-sysupgrade.bin
            release/*-factory.bin
            release/sha256sums.txt
