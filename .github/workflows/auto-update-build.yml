name: Auto Update & Build Firmware

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'force build even if no update'
        type: boolean
        default: false

concurrency:
  group: auto-update-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  UPSTREAM_BRANCH: openwrt-24.10-6.6
  DEFCONFIG_FILE: defconfig/mt7986-ax6000_dae.config
  CFG_TARGET: mediatek
  CFG_SUBTARGET: filogic
  CFG_DEVICE: tplink_tl-xdr6088
  MAIN_DEVICE: tplink_tl-xdr6088
  JOBS: 3
  TZ: Asia/Shanghai

jobs:
  check-and-build:
    runs-on: ubuntu-22.04
    steps:

      - name: Set timezone
        run: |
          sudo timedatectl set-timezone "$TZ"
          echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h

      - name: Shallow fetch upstream HEAD
        id: probe
        run: |
          git clone --depth 1 --branch "$UPSTREAM_BRANCH" "$UPSTREAM_REPO" /tmp/probe
          UP_SHA=$(git -C /tmp/probe rev-parse HEAD)
          echo "upstream_sha=$UP_SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_short=${UP_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Restore last-built sha cache
        id: cache-sha
        uses: actions/cache@v4
        with:
          path: .last_sha
          key: last-built-sha-${{ github.run_id }}
          restore-keys: last-built-sha-

      - name: Decide whether to build
        id: check
        run: |
          UP="${{ steps.probe.outputs.upstream_sha }}"
          LAST=""
          if [ -f .last_sha ]; then
            LAST=$(cat .last_sha)
          fi
          echo "upstream=$UP last_built=$LAST"
          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            HAS_UPDATE=true
          elif [ "$UP" = "$LAST" ]; then
            HAS_UPDATE=false
          else
            HAS_UPDATE=true
          fi
          echo "has_update=$HAS_UPDATE" >> "$GITHUB_OUTPUT"
          echo "$UP" > .last_sha

      - name: Skip if no update
        if: steps.check.outputs.has_update != 'true'
        run: echo "No new upstream commit, skip."

      - name: Save last-built sha cache
        if: always()
        uses: actions/cache@v4
        with:
          path: .last_sha
          key: last-built-sha-${{ github.run_id }}

      - name: Clone full upstream source
        if: steps.check.outputs.has_update == 'true'
        run: |
          git clone --branch "$UPSTREAM_BRANCH" "$UPSTREAM_REPO" openwrt
          cd openwrt
          echo "SRC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        if: steps.check.outputs.has_update == 'true'
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget qemu-utils libelf-dev ecj fastjar java-propose-classpath
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Cache downloads and build dir
        if: steps.check.outputs.has_update == 'true'
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/build_dir
          key: ow-mt798x-${{ steps.probe.outputs.upstream_short }}
          restore-keys: |
            ow-mt798x-

      - name: Update and install feeds
        if: steps.check.outputs.has_update == 'true'
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        if: steps.check.outputs.has_update == 'true'
        working-directory: openwrt
        run: |
          rm -f .config
          if [ ! -f "$DEFCONFIG_FILE" ]; then
            echo "ERROR: defconfig not found: $DEFCONFIG_FILE"
            ls -la defconfig/ || true
            exit 1
          fi
          cp "$DEFCONFIG_FILE" .config
          sed -i 's/^CONFIG_TARGET_MULTI_PROFILE=y/# CONFIG_TARGET_MULTI_PROFILE is not set/' .config
          sed -i 's/^CONFIG_TARGET_PER_DEVICE_ROOTFS=y/# CONFIG_TARGET_PER_DEVICE_ROOTFS is not set/' .config
          sed -i -E "/^CONFIG_TARGET_DEVICE_/ { /${CFG_DEVICE}/!d; }" .config
          if ! grep -q "CONFIG_TARGET_DEVICE_${CFG_TARGET}_${CFG_SUBTARGET}_DEVICE_${CFG_DEVICE}=y" .config; then
            echo "CONFIG_TARGET_DEVICE_${CFG_TARGET}_${CFG_SUBTARGET}_DEVICE_${CFG_DEVICE}=y" >> .config
          fi
          make defconfig
          echo "==== selected devices ===="
          grep -E "CONFIG_TARGET_.*_DEVICE_" .config | grep -v PACKAGES || true

      - name: Download sources
        if: steps.check.outputs.has_update == 'true'
        working-directory: openwrt
        run: |
          make download -j8 V=s || make download -j1 V=s

      - name: Build firmware
        if: steps.check.outputs.has_update == 'true'
        working-directory: openwrt
        run: |
          make toolchain/install -j${JOBS} V=s
          make -j${JOBS} V=s || make -j1 V=s

      - name: Collect firmware images
        if: steps.check.outputs.has_update == 'true'
        id: fw
        run: |
          mkdir -p firmware
          find openwrt/bin/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.ubi" -o -name "*.itb" -o -name "*.trx" \) -exec cp -v {} firmware/ \;
          cd firmware
          for f in *; do
            case "$f" in
              *"${CFG_DEVICE}"*|*xdr6088*) ;;
              *) rm -f "$f" ;;
            esac
          done
          ls -lh
          echo "count=$(ls -1 2>/dev/null | grep -c .)" >> "$GITHUB_OUTPUT"
          sha256sum * > SHA256SUMS 2>/dev/null || true

      - name: Upload artifact
        if: steps.check.outputs.has_update == 'true' && steps.fw.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.MAIN_DEVICE }}-${{ env.BUILD_DATE }}
          path: firmware/
          retention-days: 30

      - name: Create GitHub Release
        if: steps.check.outputs.has_update == 'true' && steps.fw.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_DATE }}
          name: "Firmware ${{ env.MAIN_DEVICE }} @ ${{ env.BUILD_DATE }}"
          body: |
            Auto build from 237 upstream.
            - Upstream commit: ${{ steps.probe.outputs.upstream_sha }}
            - Device: ${{ env.CFG_DEVICE }}
            - Defconfig: ${{ env.DEFCONFIG_FILE }}
            - Build time: ${{ env.BUILD_DATE }}
          files: firmware/*
          prerelease: false
