name: Auto Update & Build Firmware

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'force build even if no update'
        type: boolean
        default: false

concurrency:
  group: auto-update-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  UPSTREAM_BRANCH: openwrt-24.10-6.6
  DEFCONFIG_FILE: defconfig/mt7986-ax6000_dae.config
  CFG_TARGET: mediatek
  CFG_SUBTARGET: filogic
  CFG_DEVICE: tplink_tl-xdr6088
  MAIN_DEVICE: tplink_tl-xdr6088
  TZ: Asia/Shanghai

jobs:
  check-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:

      - name: Set timezone
        run: |
          sudo timedatectl set-timezone "$TZ"
          echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h

      - name: Shallow fetch upstream HEAD
        id: probe
        run: |
          git clone --depth 1 --branch "$UPSTREAM_BRANCH" "$UPSTREAM_REPO" /tmp/probe
          UP_SHA=$(git -C /tmp/probe rev-parse HEAD)
          echo "upstream_sha=$UP_SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_short=${UP_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Restore last-built sha cache
        id: cache-sha
        uses: actions/cache@v4
        with:
          path: .last_sha
          key: last-built-sha-${{ github.run_id }}
          restore-keys: last-built-sha-

      - name: Decide whether to build
        id: check
        run: |
          UP="${{ steps.probe.outputs.upstream_sha }}"
          LAST=""
          [ -f .last_sha ] && LAST=$(cat .last_sha)
          echo "upstream=$UP last_built=$LAST"
          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            HAS_UPDATE=true
          elif [ "$UP" = "$LAST" ]; then
            HAS_UPDATE=false
          else
            HAS_UPDATE=true
          fi
          echo "has_update=$HAS_UPDATE" >> "$GITHUB_OUTPUT"
          echo "$UP" > .last_sha

      - name: Skip if no update
        if: steps.check.outputs.has_update != 'true'
        run: echo "No new upstream commit, skip."

      - name: Save last-built sha cache
        if: always()
        uses: actions/cache@v4
        with:
          path: .last_sha
          key: last-built-sha-${{ github.run_id }}

      - name: Clone full upstream source
        if: steps.check.outputs.has_update == 'true'
        run: |
          git clone --branch "$UPSTREAM_BRANCH" "$UPSTREAM_REPO" openwrt
          cd openwrt
          echo "SRC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        if: steps.check.outputs.has_update == 'true'
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils libelf-dev ecj fastjar java-propose-classpath
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Cache download directory
        if: steps.check.outputs.has_update == 'true'
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ steps.probe.outputs.upstream_short }}
          restore-keys: |
            dl-

      - name: Update and install feeds
        if: steps.check.outputs.has_update == 'true'
        working-directory: openwrt
        timeout-minutes: 15
        run: |
          ./scripts/feeds update -a || { sleep 5; ./scripts/feeds update -a; }
          ./scripts/feeds install -a

      - name: Generate .config
        if: steps.check.outputs.has_update == 'true'
        working-directory: openwrt
        run: |
          rm -f .config
          if [ ! -f "$DEFCONFIG_FILE" ]; then
            echo "ERROR: defconfig not found: $DEFCONFIG_FILE"
            ls -la defconfig/ || true
            exit 1
          fi
          cp "$DEFCONFIG_FILE" .config
          make defconfig
          sed -i 's/^CONFIG_TARGET_MULTI_PROFILE=y/# CONFIG_TARGET_MULTI_PROFILE is not set/' .config
          sed -i 's/^CONFIG_TARGET_PER_DEVICE_ROOTFS=y/# CONFIG_TARGET_PER_DEVICE_ROOTFS is not set/' .config
          sed -i -E 's/^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_(.*)=y/# CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_\1 is not set/' .config
          sed -i 's/^# CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_tplink_tl-xdr6088 is not set/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_tplink_tl-xdr6088=y/' .config
          grep -q "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_tplink_tl-xdr6088=y" .config || \
            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_tplink_tl-xdr6088=y" >> .config
          make defconfig
          echo "==== selected devices ===="
          grep "^CONFIG_TARGET_DEVICE_.*=y" .config || true

      - name: Patch mirrors and download sources
        if: steps.check.outputs.has_update == 'true'
        timeout-minutes: 30
        working-directory: openwrt
        run: |
          # ===== 1. 清理缓存中的脏文件 =====
          find dl -type f -size 0 -delete 2>/dev/null || true
          find dl -name "*.aria2" -delete 2>/dev/null || true
          find dl -name "*.tmp" -delete 2>/dev/null || true

          # ===== 2. 全仓库搜索并删除不稳定镜像 =====
          # 不猜文件位置，grep找到就删
          echo "==== removing bad mirrors ===="
          grep -rl "mirror\.iscas\.ac\.cn" . --include="*.pl" --include="*.mk" --include="*.sh" --include="Makefile" --include="rules.mk" 2>/dev/null | while read -r f; do
            echo "  patching: $f"
            sed -i '/mirror\.iscas\.ac\.cn/d' "$f"
          done
          # 验证
          REMAINING=$(grep -r "mirror\.iscas\.ac\.cn" . 2>/dev/null | grep -v ".git/" | wc -l)
          echo "  iscas references remaining: $REMAINING"

          # ===== 3. 全仓库缩短curl超时 =====
          echo "==== reducing curl timeouts ===="
          grep -rl "\-\-connect-timeout" . --include="*.pl" --include="*.mk" --include="*.sh" 2>/dev/null | while read -r f; do
            echo "  patching timeout in: $f"
            sed -i 's/--connect-timeout [0-9]\+/--connect-timeout 10/g' "$f"
            sed -i 's/--retry [0-9]\+/--retry 2/g' "$f"
          done

          # ===== 4. 下载：3次并发 + 1次串行兜底 =====
          ok=0
          for i in 1 2 3; do
            echo "==== download attempt $i (-j24) ===="
            if timeout --kill-after=30 600 make download -j24 V=s 2>&1 | tail -50; then
              ok=1
              break
            fi
            echo "attempt $i failed, cleaning partial files..."
            find dl -type f -size 0 -delete 2>/dev/null || true
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "==== serial fallback (-j1) ===="
            if timeout --kill-after=30 600 make download -j1 V=s 2>&1 | tail -100; then
              ok=1
            fi
          fi
          if [ "$ok" != "1" ]; then
            echo "ERROR: download failed after all retries"
            echo "Files in dl/: $(ls -1 dl 2>/dev/null | wc -l)"
            exit 1
          fi
          echo "==== download complete: $(ls -1 dl | wc -l) files, $(du -sh dl | cut -f1) ===="

      - name: Build firmware
        if: steps.check.outputs.has_update == 'true'
        timeout-minutes: 120
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s 2>&1 | tail -200 || make -j1 V=s 2>&1 | tail -200

      - name: Collect firmware images
        if: steps.check.outputs.has_update == 'true'
        id: fw
        run: |
          mkdir -p firmware
          find openwrt/bin/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.ubi" -o -name "*.itb" -o -name "*.trx" -o -name "*.tar.gz" \) -exec cp -v {} firmware/ \; 2>/dev/null || true
          cd firmware
          # 只保留目标设备的文件
          count=0
          for f in *; do
            [ "$f" = "*" ] && break
            case "$f" in
              *xdr6088*|*XDR6088*) count=$((count+1)) ;;
              *) rm -f "$f" ;;
            esac
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"
          [ "$count" -gt 0 ] && sha256sum * > SHA256SUMS 2>/dev/null || true
          ls -lh

      - name: Upload artifact
        if: steps.check.outputs.has_update == 'true' && steps.fw.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.MAIN_DEVICE }}-${{ env.BUILD_DATE }}
          path: firmware/
          retention-days: 30

      - name: Create GitHub Release
        if: steps.check.outputs.has_update == 'true' && steps.fw.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_DATE }}-${{ steps.probe.outputs.upstream_short }}
          name: "Firmware ${{ env.MAIN_DEVICE }} @ ${{ env.BUILD_DATE }}"
          body: |
            Auto build from upstream.
            - Upstream commit: ${{ steps.probe.outputs.upstream_sha }}
            - Device: ${{ env.CFG_DEVICE }}
            - Defconfig: ${{ env.DEFCONFIG_FILE }}
            - Build time: ${{ env.BUILD_DATE }}
          files: firmware/*
          prerelease: false
