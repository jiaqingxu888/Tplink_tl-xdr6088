name: Auto Update & Build Firmware

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'force build even if no update'
        type: boolean
        default: false

concurrency:
  group: auto-update-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  UPSTREAM_BRANCH: openwrt-24.10-6.6
  DEFCONFIG_FILE: defconfig/mt7986-ax6000_dae.config
  CFG_TARGET: mediatek
  CFG_SUBTARGET: filogic
  TZ: Asia/Shanghai

jobs:
  check-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:

      - name: Set timezone
        run: |
          sudo timedatectl set-timezone "$TZ"
          echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h

      - name: Shallow fetch upstream HEAD
        id: probe
        run: |
          git clone --depth 1 --branch "$UPSTREAM_BRANCH" "$UPSTREAM_REPO" /tmp/probe
          UP_SHA=$(git -C /tmp/probe rev-parse HEAD)
          echo "upstream_sha=$UP_SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_short=${UP_SHA:0:8}" >> "$GITHUB_OUTPUT"

      # restore 放前面：读出"上次成功发布"记下的 sha
      - name: Restore last-built sha cache
        id: cache-sha
        uses: actions/cache@v4
        with:
          path: .last_sha
          key: last-built-sha-${{ github.run_id }}
          restore-keys: last-built-sha-

      # Decide 只判断，绝不写 .last_sha
      - name: Decide whether to build
        id: check
        run: |
          UP="${{ steps.probe.outputs.upstream_sha }}"
          LAST=""
          [ -f .last_sha ] && LAST=$(cat .last_sha)
          echo "upstream=$UP last_built=$LAST"
          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            HAS_UPDATE=true
          elif [ "$UP" = "$LAST" ]; then
            HAS_UPDATE=false
          else
            HAS_UPDATE=true
          fi
          echo "has_update=$HAS_UPDATE" >> "$GITHUB_OUTPUT"

      - name: Skip if no update
        if: steps.check.outputs.has_update != 'true'
        run: echo "No new upstream commit, skip."

      - name: Clone full upstream source
        if: steps.check.outputs.has_update == 'true'
        run: |
          git clone --branch "$UPSTREAM_BRANCH" "$UPSTREAM_REPO" openwrt
          cd openwrt
          echo "SRC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        if: steps.check.outputs.has_update == 'true'
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils libelf-dev ecj fastjar java-propose-classpath
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Cache download directory
        if: steps.check.outputs.has_update == 'true'
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ steps.probe.outputs.upstream_short }}
          restore-keys: |
            dl-

      - name: Update and install feeds
        if: steps.check.outputs.has_update == 'true'
        working-directory: openwrt
        timeout-minutes: 15
        run: |
          ./scripts/feeds update -a || { sleep 5; ./scripts/feeds update -a; }
          ./scripts/feeds install -a

      - name: Generate .config
        if: steps.check.outputs.has_update == 'true'
        working-directory: openwrt
        run: |
          rm -f .config
          if [ ! -f "$DEFCONFIG_FILE" ]; then
            echo "ERROR: defconfig not found: $DEFCONFIG_FILE"
            ls -la defconfig/ || true
            exit 1
          fi
          echo "==== raw defconfig CONFIG_TARGET lines ===="
          grep -E "CONFIG_TARGET" "$DEFCONFIG_FILE" || echo "(none)"
          cp "$DEFCONFIG_FILE" .config
          make defconfig

          echo "==== after make defconfig: selected devices ===="
          grep "^CONFIG_TARGET_.*_DEVICE_.*=y" .config || true

          DEVICE_LINE=$(grep "^CONFIG_TARGET_${CFG_TARGET}_${CFG_SUBTARGET}_DEVICE_.*=y" .config | head -1)
          if [ -z "$DEVICE_LINE" ]; then
            echo "FATAL: no device selected under ${CFG_TARGET}/${CFG_SUBTARGET}."
            grep "CONFIG_TARGET_.*_DEVICE_" .config || echo "(none at all)"
            exit 1
          fi
          DEVICE_NAME=$(echo "$DEVICE_LINE" | sed -E "s/^CONFIG_TARGET_${CFG_TARGET}_${CFG_SUBTARGET}_DEVICE_(.*)=y$/\1/")
          [ -z "$DEVICE_NAME" ] && { echo "FATAL: parse device name failed: $DEVICE_LINE"; exit 1; }
          echo "TARGET_DEVICE=$DEVICE_NAME" >> "$GITHUB_ENV"
          echo "==== TARGET_DEVICE = $DEVICE_NAME ===="

          sed -i 's/^CONFIG_TARGET_MULTI_PROFILE=y/# CONFIG_TARGET_MULTI_PROFILE is not set/' .config
          sed -i 's/^CONFIG_TARGET_PER_DEVICE_ROOTFS=y/# CONFIG_TARGET_PER_DEVICE_ROOTFS is not set/' .config
          make defconfig

          echo "==== FINAL selected devices (must be exactly 1) ===="
          FINAL=$(grep "^CONFIG_TARGET_.*_DEVICE_.*=y" .config)
          echo "$FINAL"
          N=$(echo "$FINAL" | grep -c .)
          [ "$N" != "1" ] && { echo "FATAL: expected 1 device, got $N"; exit 1; }
          echo "$FINAL" | grep -q "$DEVICE_NAME" || { echo "FATAL: final device != $DEVICE_NAME"; exit 1; }
          echo "OK: single device $DEVICE_NAME confirmed."

      - name: Patch mirrors and download sources
        if: steps.check.outputs.has_update == 'true'
        timeout-minutes: 30
        working-directory: openwrt
        run: |
          find dl -type f -size 0 -delete 2>/dev/null || true
          find dl -name "*.aria2" -delete 2>/dev/null || true
          find dl -name "*.tmp" -delete 2>/dev/null || true

          echo "==== removing bad mirrors ===="
          grep -rl "mirror\.iscas\.ac\.cn" . --include="*.pl" --include="*.mk" --include="*.sh" --include="Makefile" 2>/dev/null | while read -r f; do
            echo "  patching: $f"
            sed -i '/mirror\.iscas\.ac\.cn/d' "$f"
          done
          echo "  iscas remaining: $(grep -r 'mirror\.iscas\.ac\.cn' . 2>/dev/null | grep -v '.git/' | wc -l)"

          echo "==== reducing curl timeouts ===="
          grep -rl "\-\-connect-timeout" . --include="*.pl" --include="*.mk" --include="*.sh" 2>/dev/null | while read -r f; do
            sed -i 's/--connect-timeout [0-9]\+/--connect-timeout 10/g' "$f"
            sed -i 's/--retry [0-9]\+/--retry 2/g' "$f"
          done

          ok=0
          for i in 1 2 3; do
            echo "==== download attempt $i (-j24) ===="
            if timeout --kill-after=30 600 make download -j24 V=s 2>&1 | tail -50; then ok=1; break; fi
            find dl -type f -size 0 -delete 2>/dev/null || true
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "==== serial fallback (-j1) ===="
            timeout --kill-after=30 600 make download -j1 V=s 2>&1 | tail -100 && ok=1
          fi
          [ "$ok" != "1" ] && { echo "ERROR: download failed"; exit 1; }
          echo "==== download complete: $(ls -1 dl | wc -l) files, $(du -sh dl | cut -f1) ===="

      - name: Build firmware
        if: steps.check.outputs.has_update == 'true'
        timeout-minutes: 120
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s 2>&1 | tail -200 || make -j1 V=s 2>&1 | tail -200

      - name: Collect all build outputs
        if: steps.check.outputs.has_update == 'true'
        id: fw
        run: |
          DEVICE="${TARGET_DEVICE}"
          echo "==== device: $DEVICE ===="
          echo "==== openwrt/bin tree (top 2 levels) ===="
          find openwrt/bin -maxdepth 2 | sort || true
          echo "==== total size of openwrt/bin ===="
          du -sh openwrt/bin || true

          rm -rf release
          mkdir -p release
          cp -a openwrt/bin/. release/

          FW_COUNT=$(find release/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.ubi" -o -name "*.itb" -o -name "*.trx" \) 2>/dev/null | wc -l)
          echo "==== firmware image files in targets: $FW_COUNT ===="
          find release/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.ubi" -o -name "*.itb" -o -name "*.trx" \) 2>/dev/null | sort

          IPK_COUNT=$(find release -type f -name "*.ipk" 2>/dev/null | wc -l)
          echo "==== ipk packages: $IPK_COUNT ===="

          PACK_NAME="immortalwrt-${DEVICE}-${{ env.BUILD_DATE }}-all.tar.gz"
          tar -czf "$PACK_NAME" -C release .
          echo "==== packed: $PACK_NAME ($(du -h "$PACK_NAME" | cut -f1)) ===="

          mkdir -p release_fw
          find release/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.ubi" -o -name "*.itb" -o -name "*.trx" \) -exec cp -v {} release_fw/ \; 2>/dev/null || true
          find release/targets -maxdepth 3 -type f \( -name "*.manifest" -o -name "sha256sums" -o -name "*.buildinfo" -o -name "profiles.json" \) -exec cp -v {} release_fw/ \; 2>/dev/null || true

          [ "$FW_COUNT" -lt 1 ] && { echo "FATAL: no firmware image built."; exit 1; }
          [ ! -s "$PACK_NAME" ] && { echo "FATAL: tar.gz is empty"; exit 1; }

          echo "fw_count=$FW_COUNT" >> "$GITHUB_OUTPUT"
          echo "ipk_count=$IPK_COUNT" >> "$GITHUB_OUTPUT"
          echo "pack_name=$PACK_NAME" >> "$GITHUB_OUTPUT"
          echo "==== collect done ===="
          ls -lh "$PACK_NAME"
          ls -lh release_fw/

      - name: Upload full bin as artifact
        if: steps.check.outputs.has_update == 'true' && steps.fw.outputs.fw_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ env.TARGET_DEVICE }}-${{ env.BUILD_DATE }}
          path: release/
          retention-days: 7

      - name: Create GitHub Release
        if: steps.check.outputs.has_update == 'true' && steps.fw.outputs.fw_count != '0'
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_DATE }}-${{ steps.probe.outputs.upstream_short }}
          name: "Firmware ${{ env.TARGET_DEVICE }} @ ${{ env.BUILD_DATE }}"
          body: |
            Auto build from upstream.
            - Upstream commit: ${{ steps.probe.outputs.upstream_sha }}
            - Device: ${{ env.TARGET_DEVICE }}
            - Defconfig: ${{ env.DEFCONFIG_FILE }}
            - Build time: ${{ env.BUILD_DATE }}
            - Firmware images: ${{ steps.fw.outputs.fw_count }}
            - IPK packages: ${{ steps.fw.outputs.ipk_count }}

            **下载说明**
            - `*-all.tar.gz`：完整产物包（固件 + 全部 ipk + manifest + buildinfo + profiles.json + sha256sums，解压后结构同本地 `bin/`）
            - 其余 `.bin`：固件单独列出，可直接下载刷机
          files: |
            ${{ steps.fw.outputs.pack_name }}
            release_fw/*
          prerelease: false

      # 只有 release 真成功，才记下 sha —— 编砸不前进，下次自动重试
      - name: Record built sha (only after successful release)
        if: steps.check.outputs.has_update == 'true' && steps.release.outcome == 'success'
        id: record
        run: echo "${{ steps.probe.outputs.upstream_sha }}" > .last_sha

      # save 挪到末尾，且仅 record 成功才存
      - name: Save last-built sha cache
        if: steps.record.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: .last_sha
          key: last-built-sha-${{ github.run_id }}
