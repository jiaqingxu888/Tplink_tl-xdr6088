
name: Auto Update & Build Firmware

# 触发：① 每 6 小时定时检测上游；② 手动 Run workflow（可强制编译）
# cron 为 UTC，下面 4 个点对应北京时间 04/10/16/22 点
on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: '即使上游无更新也强制编译一次'
        type: boolean
        default: false

# 同一时间只跑一个，避免重复编译 / push 冲突
concurrency:
  group: auto-update-build
  cancel-in-progress: false

env:
  # ===== ① 上游（237 的库，已填好，无需改） =====
  UPSTREAM_REPO:   https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  UPSTREAM_BRANCH: openwrt-24.10-6.6

  # ===== ② 用哪个 defconfig 文件（已填好，无需改） =====
  # 该文件已含 MULTI_PROFILE，会同时产出 xdr6088 / xdr6086 / gl-mt6000 / redmi-ax6000-stock 等
  DEFCONFIG_FILE:  defconfig/mt7986-ax6000_dae.config

  # 仅用于产物命名/Release 文案展示，不影响编译
  MAIN_DEVICE:     tplink_tl-xdr6088

  # 是否把同步后的源码 push 回你自己的仓库（让 fork 始终最新）
  PUSH_BACK:       true

  JOBS: 3
  TZ: Asia/Shanghai

jobs:
  check-and-build:
    runs-on: ubuntu-22.04

    steps:
      # ---------- 0. 时区 + 清磁盘 ----------
      - name: Set timezone
        run: |
          sudo timedatectl set-timezone "$TZ"
          echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h

      # ---------- 1. 检出自己的仓库（带完整历史，便于和上游比较/合并） ----------
      - name: Checkout own repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 2. 检测上游是否有更新 ----------
      - name: Detect upstream updates
        id: check
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          LOCAL_SHA=$(git rev-parse HEAD)
          echo "local_sha=$LOCAL_SHA"

          git remote add upstream "$UPSTREAM_REPO" || true
          git fetch upstream "$UPSTREAM_BRANCH" --depth=200
          UP_SHA=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          echo "upstream_sha=$UP_SHA"

          if git merge-base --is-ancestor "$UP_SHA" HEAD; then
            HAS_UPDATE="false"
          else
            HAS_UPDATE="true"
          fi
          echo "has_update=$HAS_UPDATE"           >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UP_SHA"             >> "$GITHUB_OUTPUT"
          echo "upstream_short=${UP_SHA:0:8}"     >> "$GITHUB_OUTPUT"

          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "强制编译已开启"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no update
        if: steps.check.outputs.has_update != 'true'
        run: echo "✅ 上游无新提交，本次不编译。"

      # ---------- 3. 合并上游到当前分支 ----------
      - name: Merge upstream into current branch
        if: steps.check.outputs.has_update == 'true'
        run: |
          # merge 保留你在 files/ 等处的本地定制；冲突时以本地为准兜底
          git merge "upstream/$UPSTREAM_BRANCH" --no-edit -X theirs || {
            echo "⚠️ 合并冲突，回退以本地为准继续";
            git checkout --ours . && git add -A && git commit --no-edit || true;
          }
          echo "MERGED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # ---------- 4. 安装编译依赖 ----------
      - name: Install build dependencies
        if: steps.check.outputs.has_update == 'true'
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils libelf-dev ecj fastjar java-propose-classpath
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      # ---------- 5. 缓存 dl / 编译中间产物（二次起大幅提速） ----------
      - name: Cache downloads & build dir
        if: steps.check.outputs.has_update == 'true'
        uses: actions/cache@v4
        with:
          path: |
            dl
            build_dir
          key: ow-mt798x-${{ steps.check.outputs.upstream_short }}
          restore-keys: |
            ow-mt798x-

      # ---------- 6. 更新 feeds ----------
      - name: Update & install feeds
        if: steps.check.outputs.has_update == 'true'
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------- 7. 生成 .config（直接用你的 defconfig，不手动注入 target 行） ----------
      - name: Generate .config from defconfig
        if: steps.check.outputs.has_update == 'true'
        run: |
          rm -f .config
          if [ ! -f "$DEFCONFIG_FILE" ]; then
            echo "❌ 找不到 $DEFCONFIG_FILE"; exit 1
          fi
          cp "$DEFCONFIG_FILE" .config
          make defconfig

      # ---------- 8. 下载源码包 ----------
      - name: Download sources
        if: steps.check.outputs.has_update == 'true'
        run: make download -j8 V=s || make download -j1 V=s

      # ---------- 9. 编译 ----------
      - name: Build firmware
        if: steps.check.outputs.has_update == 'true'
        run: |
          make toolchain/install -j${JOBS} V=s
          make -j${JOBS} V=s || make -j1 V=s

      # ---------- 10. 收集固件（递归 bin/targets，兼容 filogic / mt7986 两种目录名） ----------
      - name: Collect firmware images
        if: steps.check.outputs.has_update == 'true'
        id: fw
        run: |
          mkdir -p firmware
          # 不写死 subtarget，递归找所有镜像
          find bin/targets -type f \
            \( -name "*.bin" -o -name "*.img" -o -name "*.ubi" -o -name "*.itb" -o -name "*.trx" \) \
            -exec cp -v {} firmware/ \;
          echo "---- 实际产物目录结构 ----"
          find bin/targets -maxdepth 3 -type d
          ls -lh firmware/ || true
          echo "count=$(ls -1 firmware/ 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
          (cd firmware && sha256sum * > SHA256SUMS) 2>/dev/null || true

      # ---------- 11. 上传 Actions 产物 ----------
      - name: Upload artifact
        if: steps.check.outputs.has_update == 'true' && steps.fw.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.MAIN_DEVICE }}-${{ env.BUILD_DATE }}
          path: firmware/
          retention-days: 30

      # ---------- 12. 发 Release ----------
      - name: Create GitHub Release
        if: steps.check.outputs.has_update == 'true' && steps.fw.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_DATE }}
          name: "Firmware ${{ env.MAIN_DEVICE }} (+multi) @ ${{ env.BUILD_DATE }}"
          body: |
            自动检测 237 上游更新并编译。
            - 上游 commit: `${{ steps.check.outputs.upstream_sha }}`
            - 主机型: `${{ env.MAIN_DEVICE }}`（同时含 defconfig 内其它机型）
            - defconfig: `${{ env.DEFCONFIG_FILE }}`
            - 构建时间: ${{ env.BUILD_DATE }}
          files: firmware/*
          prerelease: false

      # ---------- 13. 把同步后的源码 push 回自己仓库 ----------
      - name: Push synced source back to own repo
        if: steps.check.outputs.has_update == 'true' && env.PUSH_BACK == 'true'
        run: |
          git push origin HEAD:${{ github.ref_name }} || \
            echo "⚠️ 推送源码失败（不影响固件产物）"
